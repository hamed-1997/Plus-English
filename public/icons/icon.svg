<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E6F68" />
      <stop offset="100%" stop-color="#084E48" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38E1D3" />
      <stop offset="100%" stop-color="#149B91" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#38E1D3" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Logo Mark Group -->
  <g transform="translate(64, 76)" filter="url(#glow)">
    <!-- Stylized Open Book Wings that form the spine of 'E' -->
    <path d="M 60 270 C 110 245 160 250 190 280 L 190 120 C 160 90 110 85 60 110 Z" fill="#F7F6F1" opacity="0.95"/>
    <path d="M 200 280 C 230 250 280 245 330 270 L 330 110 C 280 85 230 90 200 120 Z" fill="#F7F6F1" opacity="0.85"/>
    
    <!-- Bold 'E' Spine & Bars Integration -->
    <!-- Vertical Spine -->
    <rect x="50" y="80" width="34" height="210" rx="17" fill="#F7F6F1"/>
    <!-- Top horizontal bar -->
    <rect x="50" y="80" width="140" height="32" rx="16" fill="#F7F6F1"/>
    <!-- Middle horizontal bar -->
    <rect x="50" y="169" width="110" height="32" rx="16" fill="#38E1D3"/>
    <!-- Bottom horizontal bar -->
    <rect x="50" y="258" width="140" height="32" rx="16" fill="#F7F6F1"/>

    <!-- Prominent '+' Growth Plus Symbol -->
    <g transform="translate(230, 95)">
      <!-- Vertical bar of Plus -->
      <rect x="42" y="0" width="28" height="112" rx="14" fill="url(#goldGrad)"/>
      <!-- Horizontal bar of Plus -->
      <rect x="0" y="42" width="112" height="28" rx="14" fill="url(#goldGrad)"/>
      <!-- Little upward spark/star -->
      <circle cx="56" cy="-18" r="8" fill="#38E1D3" />
    </g>
  </g>
</svg>
